name: Lab 4 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-checks:
    name: Build and check PHP
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build PHP image
        run: docker build --tag lab4-php:ci .

      - name: Start PHP container
        run: |
          docker run --detach \
            --name lab_php \
            --volume "$GITHUB_WORKSPACE/www:/usr/share/nginx/html:ro" \
            lab4-php:ci

      - name: Check every PHP file
        shell: pwsh
        run: ./scripts/Test-Php.ps1

      - name: Show container logs on failure
        if: failure()
        run: docker logs lab_php || true

      - name: Remove test container
        if: always()
        run: docker rm --force lab_php || true

  database-checks:
    name: Check fresh database initialization
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      MYSQL_ROOT_PASSWORD: ci_only_root_password
      MYSQL_DATABASE: lab4_ci
      DB_USER: lab4_ci_user
      DB_PASSWORD: ci_only_database_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate test Compose configuration
        run: docker compose -p lab4-ci -f compose.init-test.yml config --quiet

      - name: Initialize fresh database
        run: |
          docker compose -p lab4-ci -f compose.init-test.yml \
            up -d --wait --wait-timeout 180

      - name: Check tables and account defaults
        shell: bash
        run: |
          set -euo pipefail

          query() {
            docker compose -p lab4-ci -f compose.init-test.yml \
              exec -T database-test sh -c \
              'MYSQL_PWD="$MYSQL_PASSWORD" mysql \
                --protocol=TCP -h 127.0.0.1 \
                -u "$MYSQL_USER" -D "$MYSQL_DATABASE" \
                --batch --skip-column-names -e "$1"' sh "$1"
          }

          query "SELECT userID, FirstName, LastName, Email, Password,
            Status, RegDatetime, LoginDatetime, LogoutDatetime,
            EmailVerified, EmailVerificationToken, TwoFactorPin,
            TwoFactorCreatedAt, TotpSecret, Role, AdminRequestStatus
            FROM users LIMIT 0;"
          echo "PASS: All required user columns exist."

          query "SELECT userID, TokenHash, ExpiresAt
            FROM password_reset_tokens LIMIT 0;"
          echo "PASS: Password-reset table and columns exist."

          user_count="$(query 'SELECT COUNT(*) FROM users;')"
          test "$user_count" = "0"
          echo "PASS: Fresh database contains no users."

          reset_count="$(query 'SELECT COUNT(*) FROM password_reset_tokens;')"
          test "$reset_count" = "0"
          echo "PASS: Fresh database contains no reset tokens."

          role_default="$(query "SELECT COLUMN_DEFAULT
            FROM information_schema.COLUMNS
            WHERE TABLE_SCHEMA = DATABASE()
              AND TABLE_NAME = 'users'
              AND COLUMN_NAME = 'Role';")"
          test "$role_default" = "user"
          echo "PASS: New accounts default to the user role."

          application_default="$(query "SELECT COLUMN_DEFAULT
            FROM information_schema.COLUMNS
            WHERE TABLE_SCHEMA = DATABASE()
              AND TABLE_NAME = 'users'
              AND COLUMN_NAME = 'AdminRequestStatus';")"
          test "$application_default" = "none"
          echo "PASS: New accounts default to no admin application."

      - name: Show database logs on failure
        if: failure()
        run: docker compose -p lab4-ci -f compose.init-test.yml logs

      - name: Remove test database
        if: always()
        run: docker compose -p lab4-ci -f compose.init-test.yml down --volumes

  web-checks:
    name: Check web pages and login redirects
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      MYSQL_ROOT_PASSWORD: ci_only_root_password
      MYSQL_DATABASE: lab4_ci
      DB_USER: lab4_ci_user
      DB_PASSWORD: ci_only_database_password
      SMTP_HOST: localhost
      SMTP_PORT: "2525"
      SMTP_USER: ci_unused
      SMTP_PASSWORD: ci_unused

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate application configuration
        run: docker compose config --quiet

      - name: Build and start application
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Wait for the website
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null \
              http://localhost:8080/login.php; then
              echo "Website is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Website did not become ready."
          exit 1

      - name: Run web smoke tests
        run: |
          docker cp tests/smoke.php lab_php:/tmp/lab4-smoke.php
          docker exec lab_php php /tmp/lab4-smoke.php http://web-server

      - name: Show application logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop test application
        if: always()
        run: docker compose down --volumes