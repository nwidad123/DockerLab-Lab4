
  web-checks:
    name: Check web pages and login redirects
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      MYSQL_ROOT_PASSWORD: ci_only_root_password
      MYSQL_DATABASE: lab4_ci
      DB_USER: lab4_ci_user
      DB_PASSWORD: ci_only_database_password
      SMTP_HOST: localhost
      SMTP_PORT: "2525"
      SMTP_USER: ci_unused
      SMTP_PASSWORD: ci_unused

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate application configuration
        run: docker compose config --quiet

      - name: Build and start application
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Wait for the website
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null \
              http://localhost:8080/login.php; then
              echo "Website is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Website did not become ready."
          exit 1

      - name: Run web smoke tests
        run: |
          docker cp tests/smoke.php lab_php:/tmp/lab4-smoke.php
          docker exec lab_php php /tmp/lab4-smoke.php http://web-server

      - name: Show application logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop test application
        if: always()
        run: docker compose down --volumes