name: Lab 4 Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticator-tests:
    name: Authenticator unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run authenticator tests
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/app:ro" \
            --workdir /app \
            php:8.2-cli \
            php tests/authenticator.php